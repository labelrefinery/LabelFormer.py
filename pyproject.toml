[project]
name = "labelformer"
version = "0.1.0"
description = "PyTorch implementation of LabelFormer (Yang et al., CoRL 2023) trained on ArgoVerse 2"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labelformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
